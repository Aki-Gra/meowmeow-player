name: Build MeowMeow Music Player APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  player-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '8.13'

      - name: Unit tests, Android lint and APK build
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

      - name: Print Android lint errors if checks fail
        if: failure()
        run: |
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi

      - name: Give APK a branded filename
        run: cp app/build/outputs/apk/debug/app-debug.apk MeowMeowMusicPlayer.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MeowMeowMusicPlayer.apk
          path: MeowMeowMusicPlayer.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
